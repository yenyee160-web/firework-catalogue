[tool.poetry]
name = "firework-catalogue"
version = "0.1.0"
description = "Vue and stateless Django learning project with Python Playwright"
authors = ["Learning project contributors"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
Django = ">=5.2,<5.3"
whitenoise = ">=6.9,<7"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-django = ">=4.8,<5"
pytest-playwright = ">=0.7,<1"
pytest-html = ">=4,<5"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "smoke: read-only tests permitted on production",
  "nonprod: requires local, ci, or staging",
]
